[project]
name = "sensors-gui"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Govarthenan Rajadurai", email = "govarthenan@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "nvidia-ml-py>=13.610.43",
]

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "nvidia-ml-py>=13.610.43",
    "psutil>=7.2.2",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff.lint.per-file-ignores]
# Test names are full sentences. A docstring on each one would only repeat the
# name. The module docstring gives the context.
"tests/*" = ["D103", "D107"]
